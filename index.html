<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: white;
            border-bottom: 1px solid #ddd;
            padding: 25px 20px;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 28px;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        #ruta {
            margin-bottom: 15px;
            color: #777;
            font-size: 14px;
        }

        #volver {
            display: none;
            margin-bottom: 20px;
            padding: 10px 16px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        #volver:hover {
            background: #eee;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .boton {
            min-height: 100px;
            padding: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.15s;
        }

        .boton:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .mensaje {
            background: white;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            color: #777;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .foto {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            background: #ddd;
            cursor: pointer;
        }

        @media (max-width: 700px) {

            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .galeria {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            main {
                padding: 0 15px;
                margin: 20px auto;
            }

            h1 {
                font-size: 24px;
            }

            .boton {
                min-height: 85px;
                font-size: 16px;
            }

        }

        @media (max-width: 400px) {

            .grid {
                grid-template-columns: 1fr;
            }

        }

        /* =======================================================
           VISOR DE IMÁGENES
           ======================================================= */
        
        #visor {
            display: none;
        
            position: fixed;
            z-index: 1000;
        
            top: 0;
            left: 0;
        
            width: 100%;
            height: 100%;
        
            background: rgba(0, 0, 0, 0.9);
        
            align-items: center;
            justify-content: center;
        
            padding: 20px;
        
            cursor: zoom-out;
        }
        
        #imagenGrande {
            max-width: 95%;
            max-height: 95%;
        
            object-fit: contain;
        
            border-radius: 8px;
        
            cursor: default;
        }
        
        #cerrar {
            position: absolute;
        
            top: 20px;
            right: 25px;
        
            width: 45px;
            height: 45px;
        
            border: none;
            border-radius: 50%;
        
            background: white;
        
            font-size: 24px;
        
            cursor: pointer;
        
            z-index: 1001;
        }
        
        #cerrar:hover {
            background: #eeeeee;
        }
    </style>
</head>


<body>

    <h1 id="titulo">Catálogo</h1>

</header>


<main>

    <div id="ruta"></div>

    <button id="volver" onclick="volver()">
        ← Volver
    </button>

    <div id="contenido"></div>

</main>

<!-- Ventana para ampliar imágenes -->

<div id="visor" onclick="cerrarImagen()">

    <button id="cerrar" onclick="cerrarImagen(event)">
        ✕
    </button>

    <img id="imagenGrande" src="" alt="">

</div>

<script>


/*

        ]

};


/*
===========================================================
                    ESTADO DE LA WEB
===========================================================
*/


let rutaActual = [];

const API_DRIVE =
    "https://script.google.com/macros/s/AKfycbwVCvtk8I1QiaKqcjGjB_laZvS45rCKFZ84RBVKn1SNL0YYEjbDi_02Bp74DK0JYHrm/exec";
    
/*
===========================================================
                    ELEMENTOS HTML
===========================================================
*/


const titulo =
    document.getElementById("titulo");

const ruta =
    document.getElementById("ruta");

const contenido =
    document.getElementById("contenido");

const botonVolver =
    document.getElementById("volver");


/*
===========================================================
                    PANTALLA INICIAL
===========================================================
*/


function inicio() {

    rutaActual = [];

    titulo.textContent = "Catálogo";

    ruta.textContent = "";

    botonVolver.style.display = "none";

    contenido.innerHTML = "";


    const grid =
        document.createElement("div");

    grid.className = "grid";


    Object.keys(catalogo).forEach(categoria => {

        const boton =
            crearBoton(
                categoria,
                () => abrirCategoria(categoria)
            );

        grid.appendChild(boton);

    });


    contenido.appendChild(grid);

}


/*
===========================================================
                    CREAR BOTÓN
===========================================================
*/


function crearBoton(texto, funcion) {

    const boton =
        document.createElement("div");

    boton.className = "boton";

    boton.textContent = texto;

    boton.onclick = funcion;

    return boton;

}


/*
===========================================================
                    ABRIR CATEGORÍA
===========================================================
*/


function abrirCategoria(nombre) {

    rutaActual = [nombre];

    mostrarCategoria(
        catalogo[nombre],
        nombre
    );

}


/*
===========================================================
                    MOSTRAR CATEGORÍA
===========================================================
*/


function mostrarCategoria(datos, nombre) {

    titulo.textContent = nombre;

    actualizarRuta();

    botonVolver.style.display = "inline-block";

    contenido.innerHTML = "";


    /*
    ROPA
    */

    if (datos.tipo === "ropa") {

        mostrarOpciones(
            ["Hombre", "Mujer"],
            genero => {

                rutaActual.push(genero);

                mostrarTemporadas(
                    datos[genero]
                );

            }
        );

        return;
    }


    /*
    CATEGORÍAS CON MARCAS
    */

    if (datos.tipo === "marcas") {

        mostrarMarcas(
            datos.marcas
        );

        return;
    }


    /*
    CATEGORÍAS CON FOTOS
    */

    if (datos.tipo === "fotos") {

        mostrarFotos(
            datos.fotos
        );

        return;
    }

}


/*
===========================================================
                    TEMPORADAS
===========================================================
*/


function mostrarTemporadas(datos) {

    titulo.textContent =
        rutaActual[rutaActual.length - 1];

    actualizarRuta();


    mostrarOpciones(
        ["Verano", "Invierno"],

        temporada => {

            rutaActual.push(temporada);

            mostrarMarcasRopa(
                datos[temporada]
            );

        }
    );

}


/*
===========================================================
                    MARCAS DE ROPA
===========================================================
*/


function mostrarMarcasRopa(datos) {

    titulo.textContent =
        rutaActual[rutaActual.length - 1];

    actualizarRuta();


    const marcas =
        Object.keys(datos);


    if (marcas.length === 0) {

        mostrarMensaje(
            "Todavía no hay marcas."
        );

        return;

    }


    mostrarOpciones(
        marcas,

        marca => {

            rutaActual.push(marca);

            mostrarPrendas(
                datos[marca]
            );

        }
    );

}


/*
===========================================================
                    MARCAS NORMALES
===========================================================
*/


function mostrarMarcas(marcas) {

    if (!marcas || marcas.length === 0) {

        mostrarMensaje(
            "Todavía no hay marcas."
        );

        return;

    }


    mostrarOpciones(
        marcas,

        marca => {

            rutaActual.push(marca);

            mostrarMensaje(
                "Todavía no hay fotografías."
            );

        }
    );

}


/*
===========================================================
                    PRENDAS
===========================================================
*/


async function mostrarPrendas(datos) {

    titulo.textContent =
        rutaActual[rutaActual.length - 1];

    actualizarRuta();


    /*
    =======================================================
                    CARPETA DE GOOGLE DRIVE
    =======================================================
    */

    if (
        datos &&
        typeof datos === "object" &&
        !Array.isArray(datos) &&
        datos.driveFolderId
    ) {

        contenido.innerHTML = `
            <div class="mensaje">
                Cargando fotografías...
            </div>
        `;


        try {

            const respuesta = await fetch(
                API_DRIVE +
                "?folderId=" +
                encodeURIComponent(
                    datos.driveFolderId
                )
            );


            if (!respuesta.ok) {

                throw new Error(
                    "Error HTTP: " +
                    respuesta.status
                );

            }


            const datosDrive =
                await respuesta.json();


            /*
            Comprobamos que Google Drive
            realmente nos ha devuelto un array.
            */

            if (!Array.isArray(datosDrive)) {

                console.error(
                    "Respuesta de Google Drive:",
                    datosDrive
                );

                throw new Error(
                    "La respuesta de Google Drive no es un array."
                );

            }


            /*
            Extraemos únicamente las URLs.
            */

            const fotos =
                datosDrive
                    .filter(
                        foto =>
                            foto &&
                            foto.url
                    )
                    .map(
                        foto =>
                            foto.url
                    );


            if (fotos.length === 0) {

                mostrarMensaje(
                    "No hay fotografías en esta carpeta."
                );

                return;

            }


            /*
            Ahora sí enviamos un ARRAY
            a mostrarFotos().
            */

            mostrarFotos(fotos);


        } catch (error) {

            console.error(
                "Error cargando Google Drive:",
                error
            );


            mostrarMensaje(
                "No se han podido cargar las fotografías."
            );

        }


        return;
    }


    /*
    =======================================================
                    ESTRUCTURA NORMAL
    =======================================================
    */

    const prendas =
        Object.keys(datos);


    if (prendas.length === 0) {

        mostrarMensaje(
            "Todavía no hay prendas."
        );

        return;

    }


    mostrarOpciones(
        prendas,
    
        prenda => {
    
            rutaActual.push(prenda);
    
            const siguiente =
                datos[prenda];
    
    
            /*
            ===================================================
            SI ES UNA CARPETA DE GOOGLE DRIVE
            ===================================================
            */
    
            if (
                siguiente &&
                typeof siguiente === "object" &&
                !Array.isArray(siguiente) &&
                siguiente.driveFolderId
            ) {
    
                mostrarPrendas(siguiente);
    
                return;
    
            }
    
    
            /*
            ===================================================
            SI ES UN ARRAY DE FOTOGRAFÍAS
            ===================================================
            */
    
            if (Array.isArray(siguiente)) {
    
                mostrarFotos(siguiente);
    
                return;
    
            }
    
    
            /*
            ===================================================
            SI ES OTRA CATEGORÍA
            ===================================================
            */
    
            if (
                siguiente &&
                typeof siguiente === "object"
            ) {
    
                mostrarPrendas(siguiente);
    
                return;
    
            }
    
    
            mostrarMensaje(
                "No se ha encontrado contenido."
            );
    
        }
    );

}


/*
===========================================================
                    OPCIONES
===========================================================
*/


function mostrarOpciones(opciones, funcion) {

    contenido.innerHTML = "";


    const grid =
        document.createElement("div");

    grid.className = "grid";


    opciones.forEach(opcion => {

        const boton =
            crearBoton(
                opcion,
                () => funcion(opcion)
            );

        grid.appendChild(boton);

    });


    contenido.appendChild(grid);

}


/*
===========================================================
                    FOTOGRAFÍAS
===========================================================
*/


function mostrarFotos(fotos) {

    titulo.textContent =
        rutaActual[rutaActual.length - 1];

    actualizarRuta();

    contenido.innerHTML = "";


    if (!fotos || fotos.length === 0) {

        mostrarMensaje(
            "Todavía no hay fotografías."
        );

        return;

    }


    const galeria =
        document.createElement("div");

    galeria.className =
        "galeria";


    fotos.forEach(rutaFoto => {

        const imagen =
            document.createElement("img");
    
        imagen.className =
            "foto";
    
        imagen.src =
            rutaFoto;
    
        imagen.alt = "";
    
        imagen.onclick = function() {
    
            abrirImagen(rutaFoto);
    
        };
    
        galeria.appendChild(imagen);

    });


    contenido.appendChild(galeria);

}


/*
===========================================================
                    MENSAJE
===========================================================
*/


function mostrarMensaje(texto) {

    contenido.innerHTML = "";

    const mensaje =
        document.createElement("div");

    mensaje.className =
        "mensaje";

    mensaje.textContent =
        texto;

    contenido.appendChild(mensaje);

}


/*
===========================================================
                    RUTA
===========================================================
*/


function actualizarRuta() {

    ruta.textContent =
        rutaActual.join(" → ");

}


/*
===========================================================
                    VOLVER
===========================================================
*/


function volver() {

    if (rutaActual.length === 0) {

        return;

    }


    rutaActual.pop();


    if (rutaActual.length === 0) {

        inicio();

        return;

    }


    reconstruir();

}


/*
===========================================================
                    RECONSTRUIR PANTALLA
===========================================================
*/


function reconstruir() {

    const categoria =
        rutaActual[0];


    /*
    -------------------------------------------------------
                        ROPA
    -------------------------------------------------------
    */

    if (categoria === "Ropa") {

        const datos =
            catalogo.Ropa;


        if (rutaActual.length === 1) {

            mostrarCategoria(
                datos,
                "Ropa"
            );

            return;

        }


        const genero =
            rutaActual[1];


        if (rutaActual.length === 2) {

            mostrarTemporadas(
                datos[genero]
            );

            return;

        }


        const temporada =
            rutaActual[2];


        if (rutaActual.length === 3) {

            mostrarMarcasRopa(
                datos
                    [genero]
                    [temporada]
            );

            return;

        }


        const marca =
            rutaActual[3];


        if (rutaActual.length === 4) {

            mostrarPrendas(
                datos
                    [genero]
                    [temporada]
                    [marca]
            );

            return;

        }

    }


    /*
    -------------------------------------------------------
                CATEGORÍAS NORMALES
    -------------------------------------------------------
    */

    const datos =
        catalogo[categoria];


    if (
        datos.tipo === "marcas" &&
        rutaActual.length === 1
    ) {

        mostrarCategoria(
            datos,
            categoria
        );

        return;

    }


    if (
        datos.tipo === "marcas" &&
        rutaActual.length === 2
    ) {

        titulo.textContent =
            rutaActual[1];

        actualizarRuta();

        mostrarMensaje(
            "Todavía no hay fotografías."
        );

        return;

    }


    /*
    GUANTES
    */

    if (datos.tipo === "fotos") {

        mostrarFotos(
            datos.fotos
        );

    }

}

    /*
    ===========================================================
                        VISOR DE IMÁGENES
    ===========================================================
    */
    
    function abrirImagen(rutaFoto) {
    
        const visor =
            document.getElementById("visor");
    
        const imagenGrande =
            document.getElementById("imagenGrande");
    
        imagenGrande.src =
            rutaFoto;
    
        visor.style.display =
            "flex";
    
    }
    
    
    function cerrarImagen(event) {
    
        /*
        Evita que al pulsar la imagen
        se cierre también el visor.
        */
    
        if (event) {
    
            event.stopPropagation();
    
        }
    
        const visor =
            document.getElementById("visor");
    
        visor.style.display =
            "none";
    
        document.getElementById("imagenGrande").src =
            "";
    
    }

/*
===========================================================
                        INICIAR
===========================================================
*/


inicio();


</script>

</html>
